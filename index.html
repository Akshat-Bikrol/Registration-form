<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Green Student Registration Form</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(rgba(0,100,0,0.6), rgba(34,139,34,0.7)),
    url("https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1600&q=80");
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
}

.container{
    width:90%;
    max-width:700px;
    margin:40px auto;
}

.form-box{
    background:rgba(255,255,255,0.95);
    padding:35px;
    border-radius:15px;
    box-shadow:0 8px 20px rgba(0,0,0,0.3);
}

h1{
    text-align:center;
    color:#1b5e20;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#555;
    margin-bottom:25px;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:6px;
    font-weight:bold;
    color:#2e7d32;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border:2px solid #a5d6a7;
    border-radius:8px;
    outline:none;
    font-size:16px;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#2e7d32;
}

.gender{
    margin-top:8px;
}

.gender input{
    width:auto;
    margin-right:5px;
}

.gender label{
    display:inline;
    margin-right:20px;
    color:#333;
    font-weight:normal;
}

button{
    width:100%;
    margin-top:25px;
    padding:14px;
    background:#2e7d32;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#1b5e20;
}

footer{
    text-align:center;
    color:white;
    padding:20px;
    font-size:15px;
}

.leaf{
    text-align:center;
    font-size:40px;
    margin-bottom:10px;
}
</style>
</head>

<body>

<div class="container">

<div class="form-box">

<div class="leaf">🌿</div>

<h1>Student Registration Form</h1>

<p class="subtitle">
"Learn Today, Protect Tomorrow."
</p>

<form>

<label>Full Name</label>
<input type="text" placeholder="Enter your full name" required>

<label>Email Address</label>
<input type="email" placeholder="Enter your email" required>

<label>Mobile Number</label>
<input type="tel" placeholder="Enter your mobile number">

<label>Date of Birth</label>
<input type="date">

<label>Gender</label>

<div class="gender">
<input type="radio" name="gender"> Male
<input type="radio" name="gender"> Female
<input type="radio" name="gender"> Other
</div>

<label>Course</label>
<select>
<option>Select Course</option>
<option>BCA</option>
<option>BSc</option>
<option>BCom</option>
<option>BA</option>
<option>BTech</option>
<option>MCA</option>
</select>

<label>Address</label>
<textarea rows="4" placeholder="Enter your address"></textarea>

<label>Favorite Environmental Activity</label>
<select>
<option>Planting Trees 🌳</option>
<option>Recycling ♻</option>
<option>Saving Water 💧</option>
<option>Cleaning Public Places 🧹</option>
<option>Wildlife Protection 🦜</option>
</select>

<label>
<input type="checkbox" style="width:auto;">
I promise to contribute towards a greener environment.
</label>

<button type="submit">🌱 Register Now</button>

</form>

</div>

</div>

<footer>
🌍 Save Nature • Save Future • Green Campus Initiative
</footer>

</body>
</html>
